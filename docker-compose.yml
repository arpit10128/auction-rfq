services:
  postgres:
    image: postgres:16-alpine
    container_name: rfq-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rfq_auction

    ports:
      - "5433:5432"

    volumes:
      - rfq_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d rfq_auction",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  rfq_postgres_data:
